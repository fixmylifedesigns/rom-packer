name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ROM Packer (includes the player template)
        run: |
          set -o pipefail
          gradle :builder:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: ' build.log | head -40 || true
            sed -n '/What went wrong/,/\* Try/p' build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -20 | while read -r line; do echo "::error::$line"; done || true

      - name: Save the full log to the ci-logs branch
        if: failure()
        run: |
          cp build.log /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rq --cached .
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -qm "CI log for ${{ github.sha }}"
          git push -qf origin HEAD:ci-logs

      - name: Collect APK
        run: cp builder/build/outputs/apk/release/builder-release.apk RomPacker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RomPacker
          path: RomPacker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ROM Packer build ${{ github.run_number }}
          files: RomPacker.apk
          make_latest: true

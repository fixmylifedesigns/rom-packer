name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ROM Packer (includes the player template)
        run: gradle :builder:assembleRelease --stacktrace

      - name: Collect APK
        run: cp builder/build/outputs/apk/release/builder-release.apk RomPacker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RomPacker
          path: RomPacker.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ROM Packer build ${{ github.run_number }}
          files: RomPacker.apk
          make_latest: true

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# ABIs the generated game APKs support (comma separated). Add x86_64 to test in the Android Studio emulator.
rompack.abis=arm64-v8a

# AGP's optimizeReleaseResources task rewrites res/mipmap-*/ic_launcher.png to short
# opaque names (res/AB.png). ROM Packer swaps the launcher icons by path when it repacks
# the player template, so path shortening has to stay off.
android.enableResourceOptimizations=false
